name: Pivot indicator parity tests

on:
  pull_request:
    paths:
      - "tradingbot_work/scripts/classic_pivot_short_oos.py"
      - "tradingbot_work/tests/test_classic_pivot_indicator_parity.py"
      - ".github/workflows/pivot-indicator-tests.yml"
  push:
    branches:
      - "audit/pine-indicator-parity"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradingbot_work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tradingbot_work/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_classic_pivot_indicator_parity.py
